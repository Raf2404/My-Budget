<!DOCTYPE html>
<html lang="fr" data-theme="onyx">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e10" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Budget">
<title>Budget Pilot</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--serif:"Instrument Serif",Georgia,"Times New Roman",serif;--sans:"Manrope",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;--r:22px;--shadow:none;--line:rgba(255,255,255,.07)}
[data-theme=onyx]{--bg:#0e0e10;--s1:#161619;--s2:#1f1f23;--txt:#f2efe9;--mute:#8e8a84;--acc:#d6b37a;--on:#1a1406;--good:#93c29f;--warn:#e2b45e;--bad:#e3806f}
[data-theme=ivoire]{--bg:#f4f0e8;--s1:#fffdf8;--s2:#ece6db;--line:rgba(40,30,20,.09);--txt:#1d1a16;--mute:#8a8276;--acc:#b5583b;--on:#fff;--good:#3f8251;--warn:#a86d14;--bad:#b23a2e;--shadow:0 1px 2px rgba(60,40,20,.04),0 8px 28px rgba(60,40,20,.06)}
[data-theme=sauge]{--bg:#0f1412;--s1:#161d1a;--s2:#1e2723;--txt:#edf2ee;--mute:#8a9b92;--acc:#a9c6a1;--on:#0e1a11;--good:#a9c6a1;--warn:#e0bd6a;--bad:#e08a7b}
[data-theme=minuit]{--bg:#0a0e19;--s1:#111727;--s2:#182035;--txt:#eef1fb;--mute:#8790ad;--acc:#a3b5ff;--on:#0b1030;--good:#8fd3b0;--warn:#e9c46a;--bad:#f08b8b}
[data-theme=rose]{--bg:#130e11;--s1:#1c1519;--s2:#261c21;--txt:#f8eef1;--mute:#a8949b;--acc:#e9a8b8;--on:#2a0f18;--good:#9fd0a8;--warn:#e8c06e;--bad:#f08f86}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;transition:background .6s,color .6s}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);min-height:100vh;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:18px 20px calc(118px + env(safe-area-inset-bottom))}
.wrap.wide{max-width:1000px}

/* typo */
.cap{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.serif{font-family:var(--serif);font-weight:400;letter-spacing:-.01em}
.hnum{font-family:var(--serif);font-size:72px;line-height:.95;letter-spacing:-.025em;font-variant-numeric:lining-nums}
.h1{font-family:var(--serif);font-size:40px;line-height:1;letter-spacing:-.02em}
.h2{font-family:var(--serif);font-size:28px;line-height:1.05;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.sub{font-size:13px;color:var(--mute);font-weight:600}
.t{font-size:15px;font-weight:700}
.acc{color:var(--acc)} .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.row{display:flex;align-items:center;gap:12px;min-width:0} .between{justify-content:space-between} .grow{flex:1;min-width:0} .end{align-items:flex-end}
.mt{margin-top:18px} .mt8{margin-top:8px} .mt4{margin-top:4px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* header */
header{display:flex;justify-content:space-between;align-items:flex-start;padding:6px 0 26px}
.hello{font-family:var(--serif);font-size:34px;line-height:1.05}
.hello em{color:var(--acc)}

/* animations */
.rise{animation:rise .7s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--d,0)*60ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.grow-x{transform-origin:left;animation:gx 1s cubic-bezier(.2,.75,.2,1) both;animation-delay:.15s}
@keyframes gx{from{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* surfaces */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);margin-top:14px;min-width:0}
.hero{position:relative;overflow:hidden;background:linear-gradient(170deg,color-mix(in srgb,var(--acc) 9%,var(--s1)),var(--s1) 55%);border:1px solid var(--line);border-radius:28px;padding:24px 22px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--acc) 60%,transparent),transparent)}
.sech{display:flex;justify-content:space-between;align-items:flex-end;margin:30px 2px 10px}
.group{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;min-height:56px}
.li+.li{border-top:1px solid var(--line)}
.li .lab{flex:1;min-width:0;font-weight:700;font-size:15px}
.li .val{font-weight:700;font-variant-numeric:tabular-nums}

/* barre de répartition */
.split{display:flex;height:10px;gap:3px;border-radius:99px;overflow:hidden;margin-top:22px}
.split i{display:block;height:100%;border-radius:2px;min-width:3px}
.c1{background:color-mix(in srgb,var(--txt) 22%,transparent)} .c2{background:color-mix(in srgb,var(--acc) 45%,transparent)} .c3{background:var(--acc)} .c4{background:color-mix(in srgb,var(--good) 80%,transparent)} .c5{background:color-mix(in srgb,var(--txt) 70%,transparent)}
.legend{margin-top:16px;display:grid;gap:0}
.legend div{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;font-weight:600}
.legend div:first-child{border-top:0}
.legend b{width:8px;height:8px;border-radius:50%;flex:none}
.legend span{flex:1;color:var(--mute)}
.legend em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums}

/* barres de progression */
.bar{height:4px;background:var(--s2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--acc);border-radius:99px;transition:width 1s cubic-bezier(.2,.75,.2,1)}
.bar.lg{height:6px}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:99px;white-space:nowrap;letter-spacing:.01em}
.b-ok{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.b-warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.b-bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.b-acc{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}
.b-mute{background:var(--s2);color:var(--mute)}

/* boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);border-radius:16px;padding:13px 16px;font-size:14.5px;font-weight:800;background:var(--s2);transition:transform .15s,opacity .2s}
.btn.pri{background:var(--acc);color:var(--on);border-color:transparent}
.btn.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-color:transparent}
.btn.full{width:100%}
.btn.ghost{background:transparent}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--s1);color:var(--txt);text-decoration:none;transition:transform .15s}
.ib.pri{background:var(--acc);color:var(--on);border-color:transparent}
.ib.sm{width:32px;height:32px;border-radius:10px;background:transparent;color:var(--mute)}
.btn:active,.ib:active,.opt:active,.chip:active,.addrow:active{transform:scale(.97)}
.addrow{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:none;border:0;border-top:1px solid var(--line);color:var(--acc);font-weight:800;font-size:14.5px;text-align:left}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--s2);border-radius:99px;padding:8px 13px;font-size:13.5px;font-weight:700;transition:transform .15s,border-color .2s}
.chip.on{border-color:var(--acc);color:var(--acc)}

/* champs */
input,textarea{background:var(--s2);border:1px solid transparent;color:var(--txt);border-radius:14px;padding:12px 14px;font-size:16px;width:100%;font-family:inherit;font-weight:600;min-width:0;transition:border-color .2s}
textarea{min-height:80px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
input[type=month]{-webkit-appearance:none;appearance:none;min-height:46px}
.ri{background:transparent;border:0;border-radius:0;padding:4px 0;text-align:right;width:120px;font-weight:700;font-variant-numeric:tabular-nums;border-bottom:1px solid transparent}
.ri:focus{border-color:var(--acc)}
.ri.l{text-align:left;width:auto;flex:1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;border:0;padding:0;margin:22px 0 8px;background:linear-gradient(var(--acc),var(--acc)) 0/var(--p,50%) 100% no-repeat,var(--s2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--txt);border:5px solid var(--bg);box-shadow:0 0 0 1px var(--acc),0 4px 12px rgba(0,0,0,.3);cursor:grab;transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--txt);border:4px solid var(--bg)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:20px;border-top:1px solid var(--line)}
.stats>div{padding:14px 0 2px;min-width:0}
.stats>div+div{padding-left:14px;border-left:1px solid var(--line)}
.stats .v{font-family:var(--serif);font-size:21px;line-height:1.1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* objectifs */
.tile{width:46px;height:46px;flex:none;border-radius:15px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:23px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid var(--line);border-radius:16px;padding:13px 14px;transition:border-color .25s,background .25s,transform .15s}
.opt .radio{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--mute);margin-top:2px;transition:.25s}
.opt.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent)}
.opt.on .radio{border-color:var(--acc);background:var(--acc);box-shadow:inset 0 0 0 3.5px var(--s1)}
.opt .ot{font-weight:800;font-size:14px}
.opt .ov{font-family:var(--serif);font-size:21px;margin-top:3px;line-height:1.1}
.opt .os{font-size:12.5px;color:var(--mute);font-weight:600;margin-top:3px}
.opt:disabled{opacity:.45;cursor:default}
.okline{display:flex;align-items:center;gap:8px;margin-top:14px;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--good) 10%,transparent);color:var(--good);font-weight:700;font-size:13.5px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--s2);font-size:13px;font-weight:600;color:var(--mute);margin-top:12px;line-height:1.45}
.note b{color:var(--txt)}
.empty{color:var(--mute);text-align:center;padding:28px 16px;font-weight:600;font-size:14px}

/* wishlist */
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(min-width:700px){.wgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.wgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.wcard{background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);transition:transform .3s}
.wcard.tap{cursor:pointer}.wcard.tap:hover{transform:translateY(-3px)}
.wimg{aspect-ratio:4/5;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:52px;position:relative}
.wimg img{width:100%;height:100%;object-fit:cover}
.wst{position:absolute;top:10px;left:10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer}
.wbody{padding:12px 14px 14px}
.wprice{font-family:var(--serif);font-size:22px}
.stars{color:var(--acc);font-size:11px;letter-spacing:2px}

/* nav */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);width:calc(100% - 28px);max-width:440px;z-index:20;display:flex;padding:6px;border-radius:22px;background:color-mix(in srgb,var(--s1) 84%,transparent);backdrop-filter:blur(24px) saturate(1.3);-webkit-backdrop-filter:blur(24px) saturate(1.3);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.25)}
nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;letter-spacing:.04em;padding:8px 0 6px;color:var(--mute);transition:color .3s;position:relative}
nav button::after{content:"";width:4px;height:4px;border-radius:50%;background:var(--acc);opacity:0;transform:scale(0);transition:.35s cubic-bezier(.4,1.6,.5,1)}
nav button.on{color:var(--txt)} nav button.on svg{color:var(--acc)}
nav button.on::after{opacity:1;transform:none}

/* sheets */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:50;opacity:0;pointer-events:none;transition:opacity .3s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px 20px;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding-bottom:calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.9,.25,1);border-top:1px solid var(--line)}
.modal.on .sheet{transform:none}
.grab{width:38px;height:4px;border-radius:99px;background:var(--s2);margin:0 auto 16px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:28px;border:1px solid var(--line)}}
.imgpick{display:flex;align-items:center;justify-content:center;gap:8px;height:160px;border-radius:20px;background:var(--s2);color:var(--mute);cursor:pointer;overflow:hidden;font-weight:700;font-size:14px}
.imgpick img{width:100%;height:100%;object-fit:cover}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px}
.seg button{flex:1;border:0;background:none;color:var(--mute);padding:9px;border-radius:11px;font-weight:800}
.seg button.on{background:var(--s1);color:var(--acc)}
.themes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sw{border:1px solid var(--line);background:var(--s1);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11px;font-weight:800}
.sw i{width:30px;height:30px;border-radius:50%;background:conic-gradient(var(--a) 0 50%,var(--b) 0);border:1px solid rgba(128,128,128,.3)}
.sw.on{border-color:var(--acc)}
.chart svg{width:100%;height:120px;display:block}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-24px);background:var(--txt);color:var(--bg);font-weight:800;font-size:13.5px;padding:11px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:.4s cubic-bezier(.3,1.4,.5,1);z-index:80}
.toast.on{opacity:1;transform:translate(-50%,0)}
.spark{position:fixed;width:5px;height:5px;border-radius:50%;background:var(--acc);z-index:90;pointer-events:none;animation:sp .9s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes sp{to{transform:translate(var(--tx),var(--ty)) scale(.2);opacity:0}}
body.share header,body.share nav{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <header>
    <div><div class="cap" id="today"></div><div class="hello mt8" data-o="hello"></div></div>
    <button class="ib" data-act="settings" aria-label="Réglages" id="gear"></button>
  </header>
  <main id="view"></main>
</div>
<nav id="nav"></nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ utilitaires ============ */
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(Math.round(n||0));
const uid=()=>Math.random().toString(36).slice(2,9);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function nowYM(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function addMonths(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+String(m).padStart(2,'0')}
function monthsBetween(a,b){const[y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return(y2-y1)*12+(m2-m1)}
function fmtYM(ym,long){if(!ym)return'—';const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('fr-FR',{month:long?'long':'short',year:'numeric'}).replace('.','')}
const safeUrl=u=>/^https?:\/\//i.test(u||'');
const num=v=>parseFloat(String(v).replace(/\s/g,'').replace(',','.'))||0;
const EMO=/^(\p{Extended_Pictographic}|\p{Regional_Indicator})[️‍\p{Extended_Pictographic}\p{Emoji_Modifier}]*\s*/u;
const splitEmo=(s,def='✨')=>{const m=String(s||'').match(EMO);return m?[m[0].trim(),s.slice(m[0].length)]:[def,s||'']};
const weeks=m=>Math.max(1,Math.round(m*4.345));
const dur=m=>Math.abs(m)<3?weeks(Math.abs(m))+' sem.':Math.abs(m)+' mois';

const I={
grid:'<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
wallet:'<path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v3"/><path d="M3 5v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M21 12h-4a2 2 0 0 0 0 4h4z"/>',
home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
flag:'<path d="M4 22V4"/><path d="M4 4h13l-2 4 2 4H4"/>',
gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
x:'<path d="M18 6 6 18M6 6l12 12"/>',
trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
link:'<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',

 return s;

/* ============ moteur de calcul ============
   Chaque mois : épargne = salaire − charges − plaisirs.
   1) L'apport reçoit sa mensualité (verrouillée).
   2) Le reste (« libre ») paie les objectifs annexes, du plus proche au plus lointain.
   3) S'il manque de l'argent, l'objectif est quand même payé à temps, selon la stratégie choisie :
      boost → on emprunte à l'apport, puis la mensualité de l'apport augmente pour rester à l'heure
      cut   → on réduit les plaisirs du montant manquant
      debt  → on emprunte à l'apport ; ce « retard » est rattrapé par les revenus annexes (primes…)
   Les revenus annexes vont sur l'apport et remboursent d'abord le retard. */
const pmt=(target,bal,n,r)=>{n=Math.max(1,n);if(!r)return Math.max(0,(target-bal)/n);const g=Math.pow(1+r,n);return Math.max(0,(target-bal*g)*r/(g-1))};
function budget(){const fixed=S.fixed.reduce((a,f)=>a+num(f.amount),0),income=num(S.income);return{fixed,income,rav:income-fixed,C:income-fixed-num(S.variable)}}
const extrasAt=ym=>S.extras.reduce((a,e)=>a+(e.month===ym?num(e.amount):0),0);
const extrasPast=()=>S.extras.reduce((a,e)=>a+(e.month<=T0?num(e.amount):0),0);
const extrasFuture=()=>S.extras.reduce((a,e)=>a+(e.month>T0?num(e.amount):0),0);
const mainN=()=>Math.max(1,monthsBetween(T0,S.main.date||T0));
function simulate(over={}){
 const bd=budget(),M=S.main,r=num(M.rate)/100/12,nM=mainN(),target=num(M.target);
 const P0=pmt(target,num(M.current),nM,r);
 const goals=S.goals.map(g=>{const rem=Math.max(0,num(g.price)-num(g.saved)),n=Math.max(1,monthsBetween(T0,g.date||T0));
  return{id:g.id,strat:(over.strat&&over.strat[g.id])||g.strat||'boost',rem,n,need:rem/n,short:0,cutMax:0,fromFree:0}}).sort((a,b)=>a.n-b.n);
 const lastG=goals.reduce((a,g)=>Math.max(a,g.n),0);
 let P=P0,B=num(M.current)+extrasPast(),debt=0,reached=B>=target?0:null,P1=null,P1t=null,BnM=null,contrib=0;
 const start=B,months=[],path=[B];
 const H=Math.max(nM,lastG)+360;
 for(let t=1;t<=H;t++){
  const ext=extrasAt(addMonths(T0,t));
  let pool=Math.max(0,bd.C-P),cut=0,dB=0,dD=0,goalPay=0;
  for(const g of goals){if(t>g.n||g.rem<=0)continue;
   const take=Math.min(pool,g.need);pool-=take;g.fromFree+=take;const s=g.need-take;goalPay+=g.need;
   if(s>.01){g.short+=s;if(g.strat==='cut'){cut+=s;g.cutMax=Math.max(g.cutMax,s)}else if(g.strat==='boost')dB+=s;else dD+=s}}
  B=B*(1+r)+P-dB-dD+ext;
  if(t<=nM)contrib+=P-dB-dD+ext;
  debt=debt*(1+r)+dD;debt-=Math.min(debt,ext);
  if(t<=36)months.push({t,P,cut,dB,dD,ext,pool,goalPay});
  if(goals.some(g=>g.strat==='boost'&&g.n===t&&g.short>0)&&t<nM){const np=pmt(target-debt,B,nM-t,r);if(np>P+.5){P=np;P1=np;P1t=t}}
  if(t<=nM+60)path.push(B);
  if(t===nM)BnM=B;
  if(reached===null&&B>=target-.5)reached=t;
  if(t>=nM&&t>=lastG&&reached!==null)break;
 }
 if(BnM===null)BnM=B;
 return{bd,P0,P1,P1t,goals,months,reached,nM,K:Math.max(0,target-BnM),debt,path,interest:Math.max(0,BnM-start-contrib),r};
}
const restos=e=>{const r=e/(num(S.restoPrice)||25);return r<1?r.toFixed(1).replace('.',','):Math.round(r)};

function statusOf(R){
 if(R.reached===null)return`<span class="badge b-bad">Hors d’atteinte</span>`;
 const d=R.reached-R.nM;
 if(d>0)return`<span class="badge b-warn">Retard ${dur(d)}</span>`;
 if(d<0)return`<span class="badge b-ok">Avance ${dur(d)}</span>`;
 return`<span class="badge b-ok">${ic('check',12)} À l’heure</span>`;
}
function outs(){
 const R=simulate(),o={},bd=R.bd,M=S.main,target=num(M.target),h=new Date().getHours();
 const m=R.months[0]||{P:R.P0,cut:0,dB:0,dD:0,pool:Math.max(0,bd.C-R.P0),goalPay:0};
 o.hello=`${h<5||h>=18?'Bonsoir':'Bonjour'}${S.name?`, <em>${esc(S.name)}</em>`:''}`;
 /* tableau de bord */
 o['#cap']=bd.C;o['#income']=bd.income;
 const parts=[['Charges fixes',bd.fixed,'c1'],['Plaisirs',num(S.variable)-m.cut,'c2'],['Apport',m.P-m.dB-m.dD,'c3'],['Objectifs annexes',m.goalPay,'c4'],['Libre',m.pool,'c5']];
 const tot=parts.reduce((a,p)=>a+Math.max(0,p[1]),0)||1;
 o.split=parts.filter(p=>p[1]>0.5).map(p=>`<i class="${p[2]} grow-x" style="width:${p[1]/tot*100}%"></i>`).join('');
 o.splitList=parts.map(p=>`<div><b class="${p[2]}"></b><span>${p[0]}</span><em>${eur(p[1])}</em></div>`).join('');
 o.capAlert=bd.C-R.P0<0?`<div class="note" style="color:var(--bad)">${ic('info',16)}<span>Ton épargne ne couvre pas la mensualité de l’apport (${eur(R.P0)}). Baisse tes plaisirs ou recule la date.</span></div>`:'';
 const saved=num(M.current)+extrasPast(),pct=target?Math.min(100,saved/target*100):0;
 o['w:main']=pct;o.mPct=Math.round(pct)+'%';o.mStatus=statusOf(R);
 o.mSaved=`${eur(saved)} sur ${eur(target)}`;o.mDateTxt=`prévu ${fmtYM(M.date)}`;
 o.mDebtLine=R.K>0?`<div class="note">${ic('info',16)}<span><b>${eur(R.K)}</b> à rattraper avec tes revenus annexes.</span></div>`:'';
 const up=R.goals.filter(g=>g.rem>0).slice(0,3);
 o.dashGoals=up.length?up.map(g=>{const G=S.goals.find(x=>x.id===g.id),p=num(G.price)?num(G.saved)/num(G.price)*100:0;
  return`<div class="li" style="padding-left:0;padding-right:0"><span class="tile">${esc(G.emoji)}</span><div class="grow"><div class="row between"><span class="t ell">${esc(G.name)}</span><span class="sub">${fmtYM(G.date)}</span></div><div class="bar mt8"><i class="grow-x" style="width:${p}%"></i></div></div></div>`}).join(''):'<div class="empty">Aucun objectif annexe</div>';
 const fx=S.extras.filter(e=>e.month>T0).sort((a,b)=>a.month<b.month?-1:1);
 o.dashExtras=fx.length?`<div class="card rise" style="--d:4"><div class="row between"><span class="cap">Revenus annexes à venir</span><span class="h2 good">+${eur(extrasFuture())}</span></div>${fx.slice(0,3).map(e=>`<div class="row between mt8 sub"><span>${esc(e.emoji)} ${esc(e.label)}</span><span>${fmtYM(e.month)} · ${eur(e.amount)}</span></div>`).join('')}</div>`:'';
 /* budget */
 o.rav=eur(bd.rav);o.capB=`<span class="${bd.C<0?'bad':''}">${eur(bd.C)}</span>`;o.fixedT=eur(bd.fixed);
 o.varV=eur(S.variable);
 o.varNote=m.cut>0?`<div class="note">${ic('info',16)}<span>Ce mois-ci, tes objectifs prennent <b>${eur(m.cut)}</b> sur tes plaisirs → il te reste <b>${eur(num(S.variable)-m.cut)}</b>.</span></div>`:'';
 o.xPast=eur(extrasPast());o.xFut=eur(extrasFuture());
 /* apport */
 o['#saved']=saved;o.mTarget=eur(target);
 o.sP=R.P1?`${eur(R.P0)} → <span class="acc">${eur(R.P1)}</span>`:eur(R.P0);
 o.sPsub=R.P1?`dès ${fmtYM(addMonths(T0,R.P1t))}`:'par mois';
 o.sDate=R.reached===null?'—':fmtYM(addMonths(T0,R.reached));
 o.sInt='+'+(R.interest>=10000?Math.round(R.interest/1000)+' k€':eur(R.interest));
 const lines=[];
 const bor=R.goals.filter(g=>g.short>0&&g.strat!=='cut').reduce((a,g)=>a+g.short,0);
 if(bor>0)lines.push(`<div class="li"><span class="lab">Avancé pour tes objectifs</span><span class="val warn">−${eur(bor)}</span></div>`);
 if(R.P1)lines.push(`<div class="li"><span class="lab">Mensualité ajustée dès ${fmtYM(addMonths(T0,R.P1t))}</span><span class="val acc">${eur(R.P1)}</span></div>`);
 if(extrasPast()+extrasFuture()>0)lines.push(`<div class="li"><span class="lab">Revenus annexes ajoutés</span><span class="val good">+${eur(extrasPast()+extrasFuture())}</span></div>`);
 lines.push(`<div class="li"><span class="lab">Reste à rattraper</span><span class="val ${R.K>0?'bad':'good'}">${R.K>0?eur(R.K):'0 € ✓'}</span></div>`);
 o.catchup=lines.join('');
 o.chart=chartSvg(R);
 if(R.P1&&R.P1>bd.C)o.capWarn=`<div class="note" style="color:var(--warn)">${ic('info',16)}<span>La mensualité ajustée (${eur(R.P1)}) dépasse ton épargne mensuelle (${eur(bd.C)}).</span></div>`;else o.capWarn='';
 /* objectifs annexes */
 S.goals.forEach(G=>{const g=R.goals.find(x=>x.id===G.id),id=G.id;
  o['w:g-'+id]=num(G.price)?Math.min(100,num(G.saved)/num(G.price)*100):0;
  o['gneed-'+id]=g.rem>0?`${eur(g.need)}/mois`:'Financé';
  if(g.rem<=0){o['gopt-'+id]=`<div class="okline">${ic('check',16)} Déjà financé</div>`;return}
  if(g.short<1){o['gopt-'+id]=`<div class="okline">${ic('check',16)} Ton épargne libre suffit, rien à changer</div>`;return}
  const rC=simulate({strat:{[id]:'cut'}}),rB=simulate({strat:{[id]:'boost'}}),rD=simulate({strat:{[id]:'debt'}});
  const cg=rC.goals.find(x=>x.id===id),cm=Math.ceil(cg.cutMax),over=cm>num(S.variable);
  const items={
   boost:rB.P1?{v:`${eur(rB.P0)} → ${eur(rB.P1)}<span class="sub"> /mois</span>`,s:`L’apport avance ${eur(g.short)} maintenant, puis sa mensualité monte dès ${fmtYM(addMonths(T0,rB.P1t))}.${rB.P1>R.bd.C?' ⚠︎ dépasse ton épargne':''}`}:
                  g.n>=R.nM?{v:'Indisponible',s:'L’objectif tombe après la date de l’apport.',dis:1}:
                  {v:`${eur(rB.P0)}<span class="sub"> /mois · inchangé</span>`,s:'L’apport avance '+eur(g.short)+', déjà compensé par tes revenus annexes prévus ✓'},
   cut:{v:`−${eur(cm)}<span class="sub"> /mois</span>`,s:over?'⚠︎ Plus que ton budget plaisirs.':`Sur tes plaisirs pendant ${cg.n} mois · ≈ ${restos(cm)} restos.`},
   debt:rD.K>0?{v:`${eur(rD.K)} <span class="sub">à rattraper</span>`,s:`Mensualité inchangée. Sans prime, l’apport ${rD.reached===null?'devient hors d’atteinte':'arrive '+dur(rD.reached-rD.nM)+' plus tard'}.`}:
                {v:'Déjà couvert',s:'Tes revenus annexes prévus rattrapent tout ✓'}
  };
  o['gopt-'+id]=`<div class="cap mt">Pour l’avoir à temps · il manque ${eur(g.short)}</div><div class="opts">${Object.entries(STRATS).map(([k,st])=>{const it=items[k];
   return`<button class="opt ${G.strat===k?'on':''}" data-act="strat" data-id="${id}" data-v="${k}" ${it.dis?'disabled':''}><span class="radio"></span><div class="grow"><div class="ot">${st.i} ${st.t}</div><div class="ov">${it.v}</div><div class="os">${it.s}</div></div></button>`}).join('')}</div>`;
 });
 return o;
}
function chartSvg(R){
 const M=S.main,target=num(M.target),nM=R.nM,end=Math.min(R.path.length-1,Math.max(nM,R.reached??nM)+2),W=600,H=120;
 const plan=[num(M.current)];let b=plan[0];for(let t=1;t<=end;t++){b=b*(1+R.r)+R.P0;plan.push(b)}
 const max=Math.max(target,...R.path.slice(0,end+1),...plan)*1.05||1,X=t=>(W*t/end).toFixed(1),Y=v=>(H-3-(H-6)*Math.max(0,v)/max).toFixed(1);
 const line=a=>a.slice(0,end+1).map((v,t)=>X(t)+','+Y(v)).join(' ');
 return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><linearGradient id="gA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/><stop offset="1" stop-color="var(--acc)" stop-opacity="0"/></linearGradient></defs>
 <line x1="0" x2="${W}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--mute)" stroke-opacity=".5" stroke-dasharray="2 5" vector-effect="non-scaling-stroke"/>
 <line x1="${X(nM)}" x2="${X(nM)}" y1="0" y2="${H}" stroke="var(--mute)" stroke-opacity=".35" vector-effect="non-scaling-stroke"/>
 <polygon points="0,${H} ${line(R.path)} ${X(end)},${H}" fill="url(#gA)"/>
 <polyline points="${line(plan)}" fill="none" stroke="var(--mute)" stroke-width="1.2" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
 <polyline points="${line(R.path)}" fill="none" stroke="var(--acc)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>
 <div class="row between sub mt8" style="font-size:11.5px"><span>${fmtYM(T0)}</span><span><span class="acc">━</span> projection &nbsp; ┅ plan initial</span><span>${fmtYM(addMonths(T0,end))}</span></div>`}

function tween(el,to){const from=el._cur??0;cancelAnimationFrame(el._r);const t0=performance.now(),D=reduce?0:800;
 const step=now=>{const k=D?Math.min(1,(now-t0)/D):1,e=1-Math.pow(1-k,4);el._cur=from+(to-from)*e;el.textContent=eur(el._cur);if(k<1)el._r=requestAnimationFrame(step)};el._r=requestAnimationFrame(step)}
function paintRange(el){el.style.setProperty('--p',((el.value-el.min)/((el.max-el.min)||1)*100)+'%')}
function refresh(){const o=outs();
 $$('[data-o]').forEach(el=>{const v=o[el.dataset.o];if(v!==undefined&&el._h!==v){el.innerHTML=v;el._h=v}});
 $$('[data-cu]').forEach(el=>{const v=o['#'+el.dataset.cu];if(v!==undefined&&el._t!==v){el._t=v;tween(el,v)}});
 $$('[data-w]').forEach(el=>{const v=o['w:'+el.dataset.w];if(v!==undefined)el.style.width=Math.min(100,v)+'%'});
 $$('[data-k=variable]').forEach(el=>el.max=Math.max(num(S.income)-budget().fixed,num(S.variable),0));
 $$('input[type=range]').forEach(paintRange);
}

 <div class="row" style="gap:8px"><button class="ib" data-act="copyWish" aria-label="Copier">${ic('copy')}</button><button class="ib" data-act="unshare" aria-label="Quitter">${ic('x')}</button></div></div>

function applyTheme(){document.documentElement.dataset.theme=S.theme;$('#themeColor').content=THEMES[S.theme].bg}
function render(){
 applyTheme();document.body.classList.toggle('share',share);$('#wrap').classList.toggle('wide',tab==='wishlist'||share);
 $('#gear').innerHTML=ic('gear',18);
 $('#nav').innerHTML=Object.entries(TABS).map(([k,[l,i]])=>`<button class="${k===tab?'on':''}" data-act="tab" data-v="${k}" aria-label="${l}">${ic(i,20)}<span>${l}</span></button>`).join('');
 $('#view').innerHTML=share?vShare():{accueil:vAccueil,budget:vBudget,apport:vApport,objectifs:vObjectifs,wishlist:vWish}[tab]();
 refresh();
}
function route(){closeModal();const h=location.hash.slice(1);share=h==='partage';if(TABS[h])tab=h;render();window.scrollTo({top:0})}
function go(h){if(location.hash.slice(1)===h)route();else location.hash=h}
$('#today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

/* ============ sheets ============ */
let openSheet=null;
function openModal(h){$('#sheet').innerHTML='<div class="grab"></div>'+h;$('#modal').classList.add('on');refresh()}
function closeModal(){$('#modal').classList.remove('on');openSheet=null}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
const shead=t=>`<div class="row between"><div class="h2">${t}</div><button class="ib sm" style="background:var(--s2)" data-act="close" aria-label="Fermer">${ic('x',16)}</button></div>`;

function goalSheet(id,pre){const g=id?S.goals.find(x=>x.id===id):Object.assign({name:'',emoji:'✨',price:'',saved:0,date:addMonths(T0,3)},pre||{});
 openModal(`${shead(id?'Modifier':'Nouvel objectif')}
 ${id?'':`<div class="chips mt">${GPRESETS.map((p,i)=>`<button class="chip" data-act="gPreset" data-i="${i}">${p.e} ${p.n}</button>`).join('')}</div>`}
 <div class="row mt"><input id="gE" value="${esc(g.emoji)}" style="width:60px;text-align:center;font-size:20px"><input id="gN" placeholder="Nom" value="${esc(g.name)}"></div>
 <div class="g3 mt8"><label class="fld"><span>Prix</span><input id="gP" inputmode="decimal" value="${esc(g.price)}"></label><label class="fld"><span>Déjà mis</span><input id="gS" inputmode="decimal" value="${esc(g.saved)}"></label><label class="fld"><span>Pour</span><input id="gD" type="month" value="${esc(g.date)}"></label></div>
 <button class="btn pri full mt" data-act="goalSave" data-id="${id||''}">${id?'Enregistrer':'Ajouter'}</button>
 ${id?`<button class="btn danger full mt8" data-act="goalDel" data-id="${id}">Supprimer</button>`:''}`)}

function extraSheet(id){const e=id?S.extras.find(x=>x.id===id):{label:'Prime',emoji:'💰',amount:'',month:T0};
 openModal(`${shead(id?'Revenu annexe':'Nouveau revenu')}
 <div class="chips mt">${XPRESETS.map((p,i)=>`<button class="chip ${p.n===e.label?'on':''}" data-act="xPreset" data-i="${i}">${p.e} ${p.n}</button>`).join('')}</div>
 <div class="row mt"><input id="xE" value="${esc(e.emoji)}" style="width:60px;text-align:center;font-size:20px"><input id="xL" placeholder="Libellé" value="${esc(e.label)}"></div>
 <div class="g2 mt8"><label class="fld"><span>Montant</span><input id="xA" inputmode="decimal" value="${esc(e.amount)}"></label><label class="fld"><span>Mois</span><input id="xM" type="month" value="${esc(e.month)}"></label></div>
 <div class="note">${ic('info',16)}<span>Ajouté à ton apport. Il rembourse d’abord ce que tes objectifs ont avancé. Un mois futur = revenu prévu.</span></div>
 <button class="btn pri full mt" data-act="extraSave" data-id="${id||''}">${id?'Enregistrer':'Ajouter'}</button>
 ${id?`<button class="btn danger full mt8" data-act="extraDel" data-id="${id}">Supprimer</button>`:''}`)}

let tmpImg='',tmpPrio=2;
function wishSheet(i){const w=i>=0?S.wish[i]:{name:'',price:'',link:'',img:'',emoji:'🎁',prio:2};tmpImg=w.img||'';tmpPrio=w.prio||2;
 openModal(`${shead(i>=0?'Modifier':'Nouvelle idée')}
 <label class="imgpick mt"><span id="imgPrev" style="display:contents">${w.img?`<img src="${w.img}" alt="">`:ic('image',22)+' Ajouter une photo'}</span><input type="file" accept="image/*" id="wImg" hidden></label>
 <div class="row mt"><input id="wEmoji" style="width:60px;text-align:center;font-size:20px" value="${esc(w.emoji||'🎁')}"><input id="wName" placeholder="Nom" value="${esc(w.name)}"></div>
 <div class="row mt8"><input id="wPrice" inputmode="decimal" placeholder="Prix €" style="max-width:120px" value="${esc(w.price)}"><input id="wLink" type="url" placeholder="Lien https://" value="${esc(w.link)}"></div>
 <div class="fld mt"><span>Priorité</span><div class="seg" id="wPrio">${[1,2,3].map(p=>`<button data-act="prio" data-i="${p}" class="${p===tmpPrio?'on':''}">${'●'.repeat(p)}</button>`).join('')}</div></div>
 <button class="btn pri full mt" data-act="wishSave" data-i="${i}">Enregistrer</button>
 ${i>=0?`<div class="g2 mt8"><button class="btn" data-act="wishGoal" data-i="${i}">En faire un objectif</button><button class="btn danger" data-act="wishDel" data-i="${i}">Supprimer</button></div>`:''}`);
 $('#wImg').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{tmpImg=await readImg(f);$('#imgPrev').innerHTML=`<img src="${tmpImg}" alt="">`}catch(_){toast('Image illisible')}}}
function readImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

function settingsSheet(){openSheet=settingsSheet;openModal(`${shead('Réglages')}
 <div class="mt">${fld('Prénom','name',S.name,'text')}</div>
 <div class="fld mt"><span>Thème</span></div>
 <div class="themes mt8">${Object.entries(THEMES).map(([k,t])=>`<button class="sw ${S.theme===k?'on':''}" data-act="theme" data-v="${k}" style="--a:${t.a};--b:${t.b}"><i></i>${t.l}</button>`).join('')}</div>
 <div class="mt">${fld('Prix moyen d’un resto','restoPrice',S.restoPrice)}</div>
 <button class="btn full mt" data-act="data">Sauvegarder / restaurer</button>`)}
function dataSheet(){const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
 openModal(`${shead('Sauvegarde')}
 <div class="fld mt"><span>Exporter</span></div><textarea id="exp" readonly class="mt8">${esc(JSON.stringify(S))}</textarea>
 <div class="${framed?'':'g2'} mt8"><button class="btn full" data-act="copyExp">${ic('copy',16)} Copier</button>${framed?'':`<button class="btn" data-act="dlExp">Télécharger</button>`}</div>
 <div class="fld mt"><span>Importer</span></div><textarea id="imp" class="mt8" placeholder="Colle ta sauvegarde ici"></textarea>
 <div class="g2 mt8"><label class="btn">Fichier<input type="file" accept=".json,application/json" id="impFile" hidden></label><button class="btn pri" data-act="doImp">Importer</button></div>
 <button class="btn danger full mt" data-act="reset">Tout réinitialiser</button>`);
 $('#impFile').onchange=e=>{const f=e.target.files[0];if(f)f.text().then(t=>{$('#imp').value=t;toast('Fichier chargé')})}}

/* ============ actions ============ */
let toastT;function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}
function sparkle(el){if(reduce||!el)return;const r=el.getBoundingClientRect();for(let i=0;i<18;i++){const s=document.createElement('i');s.className='spark';s.style.left=r.left+r.width/2+'px';s.style.top=r.top+r.height/2+'px';const a=i/18*Math.PI*2,d=40+Math.random()*50;s.style.setProperty('--tx',Math.cos(a)*d+'px');s.style.setProperty('--ty',Math.sin(a)*d+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950)}}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copié')}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Copié':'Copie impossible ici')}}
const commit=()=>{save();render();if(openSheet&&$('#modal').classList.contains('on'))openSheet()};
const val=id=>$('#'+id).value;
const A={
 tab:t=>go(t.dataset.v),share:()=>go('partage'),unshare:()=>go('wishlist'),
 settings:settingsSheet,data:dataSheet,close:closeModal,
 theme:t=>{S.theme=t.dataset.v;save();render();settingsSheet()},
 addFixed:()=>{S.fixed.push({name:'Nouvelle charge',amount:0});commit()},
 delFixed:t=>{S.fixed.splice(+t.dataset.i,1);commit()},
 strat:t=>{const g=S.goals.find(x=>x.id===t.dataset.id);g.strat=t.dataset.v;save();refresh();sparkle(t.querySelector('.radio'))},
 goalNew:()=>goalSheet(null),goalEdit:t=>goalSheet(t.dataset.id),
 gPreset:t=>{const p=GPRESETS[+t.dataset.i];$('#gE').value=p.e;$('#gN').value=p.n;$('#gP').value=p.p;$$('#sheet .chip').forEach(c=>c.classList.toggle('on',c===t))},
 goalSave:t=>{const id=t.dataset.id,d={emoji:val('gE').trim()||'✨',name:val('gN').trim()||'Objectif',price:num(val('gP')),saved:num(val('gS')),date:val('gD')||addMonths(T0,3)};
  if(!d.price){toast('Indique un prix');return}
  if(id)Object.assign(S.goals.find(x=>x.id===id),d);else S.goals.push({id:uid(),strat:'boost',...d});
  closeModal();save();if(tab!=='objectifs'&&!id){toast('Ajouté à tes objectifs');render()}else render()},
 goalDel:t=>{S.goals=S.goals.filter(x=>x.id!==t.dataset.id);closeModal();commit()},
 extraNew:()=>extraSheet(null),extraEdit:t=>extraSheet(t.dataset.id),
 xPreset:t=>{const p=XPRESETS[+t.dataset.i];$('#xE').value=p.e;$('#xL').value=p.n;$$('#sheet .chip').forEach(c=>c.classList.toggle('on',c===t))},
 extraSave:t=>{const id=t.dataset.id,d={emoji:val('xE').trim()||'💰',label:val('xL').trim()||'Revenu',amount:num(val('xA')),month:val('xM')||T0};
  if(!d.amount){toast('Indique un montant');return}
  if(id)Object.assign(S.extras.find(x=>x.id===id),d);else S.extras.push({id:uid(),...d});
  closeModal();save();render();toast(id?'Modifié':'+'+eur(d.amount)+' ajouté')},
 extraDel:t=>{S.extras=S.extras.filter(x=>x.id!==t.dataset.id);closeModal();commit()},
 wishNew:()=>wishSheet(-1),wishEdit:t=>wishSheet(+t.dataset.i),
 wishDel:t=>{S.wish.splice(+t.dataset.i,1);closeModal();commit()},
 wishSt:t=>{const k=Object.keys(WST),w=S.wish[+t.dataset.i];w.status=k[(k.indexOf(w.status||'envie')+1)%k.length];if(w.status==='offert')sparkle(t);commit()},
 wishGoal:t=>{const w=S.wish[+t.dataset.i];goalSheet(null,{name:w.name,emoji:w.emoji||'🎁',price:num(w.price)})},
 prio:t=>{tmpPrio=+t.dataset.i;$$('#wPrio button').forEach(b=>b.classList.toggle('on',+b.dataset.i===tmpPrio))},
 wishSave:t=>{const i=+t.dataset.i,w={id:i>=0?S.wish[i].id:uid(),name:val('wName').trim()||'Idée',price:num(val('wPrice')),link:val('wLink').trim(),emoji:val('wEmoji').trim()||'🎁',img:tmpImg,prio:tmpPrio,status:i>=0?S.wish[i].status:'envie'};
  if(i>=0)S.wish[i]=w;else S.wish.push(w);closeModal();commit()},
 copyWish:()=>copy('🎁 Ma wishlist\n'+S.wish.filter(w=>w.status!=='offert').map(w=>`• ${w.name} — ${eur(w.price)}${safeUrl(w.link)?' — '+w.link:''}`).join('\n')),
 copyExp:()=>copy($('#exp').value),
 dlExp:()=>{try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='budget-pilot-'+T0+'.json';a.click()}catch(e){toast('Téléchargement impossible ici')}},
 doImp:()=>{try{const d=JSON.parse($('#imp').value);if(!d||typeof d!=='object'||!('income' in d))throw 0;S=migrate(d);closeModal();commit();toast('Données importées')}catch(e){toast('Sauvegarde invalide')}},
 reset:t=>{t.dataset.act='resetOk';t.textContent='Sûr ? Touche encore pour confirmer'},
 resetOk:()=>{S=clone(DEFAULT);closeModal();commit();toast('Réinitialisé')}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=A[t.dataset.act];if(a){e.preventDefault();e.stopPropagation();a(t)}});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset.k;if(!k)return;let v=el.value;if(el.type==='month'&&!v)return;
 if(el.type==='range'||'n' in el.dataset)v=num(v);setPath(k,v);save();refresh()});
window.addEventListener('hashchange',route);
route();
/* installation PWA (GitHub Pages) */
if('serviceWorker' in navigator&&location.protocol==='https:'){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
</script>
